openapi: 3.0.3
info:
  title: Bank Account API
  version: 1.0.0
  description: |
    REST API for managing bank accounts and financial transactions.

    The API follows a modular monolith architecture.
    Financial operations support atomicity, concurrency safety, and idempotency.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Application health checks
  - name: Accounts
    description: Bank account management
  - name: Transfers
    description: Transfers between bank accounts
  - name: Reconciliation
    description: Read-only ledger consistency checks
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API availability
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /api/v1/accounts:
    post:
      tags:
        - Accounts
      summary: Create a bank account
      description: |
        Creates a new EUR bank account.

        The initial balance defaults to zero when omitted.
        A positive initial balance is funded through the internal
        system account and recorded in the double-entry ledger.

        The operation is atomic and idempotent.
      operationId: createAccount
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique key identifying the account creation request.
            Repeating the same request with the same key returns
            the original result without creating another account.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create_account_request'
      responses:
        '201':
          description: Bank account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '400':
          description: Invalid request payload or missing Idempotency-Key.
        '409':
          description: Idempotency-Key reused with a different request.
  /api/v1/accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get a bank account
      description: |
        Retrieves an existing customer bank account by its ID,
        including its currency and current balance.
      operationId: getAccountById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the bank account.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Bank account retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '400':
          description: Invalid account ID.
        '404':
          description: Bank account not found.
        '500':
          description: Internal server error.
  /api/v1/accounts/{id}/deposits:
    post:
      tags:
        - Accounts
      summary: Deposit funds into a bank account
      description: |
        Deposits funds into an existing EUR customer account.

        Funds are transferred from the internal system account
        to the destination customer account.

        The operation is atomic and idempotent.
        Each successful deposit creates two balanced ledger entries.

        Repeating the same request with the same Idempotency-Key
        does not deposit funds again.
      operationId: depositFunds
      parameters:
        - name: id
          in: path
          required: true
          description: Destination customer account ID.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key identifying the deposit operation.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deposit_request'
      responses:
        '200':
          description: Deposit completed successfully or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '400':
          description: Invalid request parameters or missing Idempotency-Key.
        '404':
          description: Customer account not found.
        '409':
          description: Idempotency-Key reused with different parameters.
        '422':
          description: Account balance overflow or underflow.
        '500':
          description: Internal server error.
  /api/v1/transfers:
    post:
      tags:
        - Transfers
      summary: Transfer funds between accounts
      description: |
        Transfers funds between two customer accounts atomically.

        The operation creates two balanced ledger entries and updates
        both account balances within a single database transaction.

        An Idempotency-Key header is required. Repeating the same request
        with the same key returns the previously stored successful response
        without executing the transfer again.

        Reusing the key with different request parameters returns HTTP 409.
      operationId: transferFunds
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key identifying this transfer request.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transfer_request'
      responses:
        '200':
          description: Transfer completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transfer_response'
        '400':
          description: Invalid request body, account IDs, amount, or missing idempotency key.
        '404':
          description: Source or destination account not found.
        '409':
          description: Idempotency key already used with different request parameters.
        '422':
          description: Insufficient funds or balance arithmetic constraint violation.
        '500':
          description: Internal server error.
  /api/v1/reconciliation:
    get:
      tags:
        - Reconciliation
      summary: Reconcile account balances and ledger transactions
      description: |
        Performs a read-only consistency check against the ledger.

        Verifies that:
        - Each account balance matches the sum of its ledger entries.
        - The sum of ledger entries for each transaction equals zero.

        The check runs inside a PostgreSQL read-only,
        repeatable-read transaction to ensure a consistent snapshot.

        A successful execution returns HTTP 200 even when
        discrepancies are detected. The status field indicates
        whether the data is consistent.
      operationId: reconcileLedger
      responses:
        '200':
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reconciliation_report'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: internal server error
components:
  schemas:
    create_account_request:
      type: object
      description: Request payload for creating a bank account.
      properties:
        initial_balance_cents:
          type: integer
          format: int64
          minimum: 0
          default: 0
          example: 10000
          description: |
            Initial account balance in euro cents.
            Defaults to zero when omitted.
      additionalProperties: false
    account:
      type: object
      description: A bank account with its current balance.
      required:
        - id
        - currency
        - balance_cents
      properties:
        id:
          type: integer
          format: int64
          example: 2
          description: Unique account identifier.
        currency:
          type: string
          enum:
            - EUR
          example: EUR
          description: Account currency.
        balance_cents:
          type: integer
          format: int64
          minimum: 0
          example: 10000
          description: Current account balance in euro cents.
    deposit_request:
      type: object
      description: Request to deposit funds into an existing bank account.
      required:
        - amount_cents
      properties:
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          description: Amount to deposit, expressed in euro cents.
          example: 5000
      additionalProperties: false
    transfer_request:
      type: object
      additionalProperties: false
      required:
        - source_account_id
        - destination_account_id
        - amount_cents
      properties:
        source_account_id:
          type: integer
          format: int64
          minimum: 1
          description: ID of the source customer account.
          example: 1
        destination_account_id:
          type: integer
          format: int64
          minimum: 1
          description: ID of the destination customer account.
          example: 2
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          description: Amount to transfer in EUR cents.
          example: 3000
    transfer_response:
      type: object
      required:
        - transaction_id
        - source_account_id
        - destination_account_id
        - amount_cents
        - destination_balance_cents
      properties:
        transaction_id:
          type: integer
          format: int64
          example: 42
        source_account_id:
          type: integer
          format: int64
          example: 1
        destination_account_id:
          type: integer
          format: int64
          example: 2
        amount_cents:
          type: integer
          format: int64
          example: 3000
        destination_balance_cents:
          type: integer
          format: int64
          description: Destination account balance after the transfer.
          example: 5000
    reconciliation_report:
      type: object
      required:
        - status
        - accounts_checked
        - transactions_checked
        - discrepancies
      properties:
        status:
          type: string
          enum:
            - consistent
            - inconsistent
          example: consistent
        accounts_checked:
          type: integer
          format: int64
          example: 8
        transactions_checked:
          type: integer
          format: int64
          example: 13
        discrepancies:
          type: array
          items:
            type: object
            required:
              - type
              - expected_cents
              - actual_cents
            properties:
              type:
                type: string
                enum:
                  - account_balance_mismatch
                  - transaction_imbalance
              account_id:
                type: integer
                format: int64
              transaction_id:
                type: integer
                format: int64
              expected_cents:
                type: integer
                format: int64
              actual_cents:
                type: integer
                format: int64
